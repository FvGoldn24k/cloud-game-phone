<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloud Game Phone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080a0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(460px, 100%);
      margin: auto;
      padding: 16px;
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
    }

    .sub {
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .card {
      background: #11151d;
      border: 1px solid #29303b;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8ff0a4;
      margin-bottom: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #36d66b;
      border-radius: 50%;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .game {
      background: white;
      color: #111;
    }

    .stop {
      background: #292f39;
      color: white;
    }

    .screen {
      width: 100%;
      height: 620px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid #303744;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 13px;
      color: #8b93a1;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main>

  <h1>Cloud Game Phone</h1>
  <div class="sub">Real Android cloud gaming</div>

  <div class="card">
    <div class="status">
      <span class="dot"></span>
      <span id="status">Ready</span>
    </div>

    <button class="game" onclick="startGame('clash-royale')">
      ⚔️ Play Clash Royale
    </button>

    <button class="game" onclick="startGame('pokemon-go')">
      🟡 Play Pokémon GO
    </button>

    <button class="stop" onclick="stopGame()">
      Stop session
    </button>
  </div>

  <div class="screen">
    <video id="video" autoplay playsinline></video>

    <div id="message">
      Choose a game to start the Android phone.
    </div>
  </div>

  <div class="small">
    The screen becomes live when a real Android WebRTC Gateway is connected.
  </div>

</main>

<script>
  let sessionId = null;
  let socket = null;
  let peer = null;

  /*
    IMPORTANT:
    Put your REAL Android Gateway address here.

    Example:
    https://your-android-gateway.example.com

    Do NOT put your Render website address here unless
    your Android Gateway is actually running there.
  */
  const ANDROID_GATEWAY = "";

  const statusEl = document.getElementById("status");
  const messageEl = document.getElementById("message");
  const videoEl = document.getElementById("video");

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function startGame(game) {
    if (!ANDROID_GATEWAY) {
      setStatus("Android host needed");
      messageEl.innerHTML =
        "The website is ready.<br><br>" +
        "A real Android Emulator + WebRTC Gateway still needs to be connected.";
      return;
    }

    try {
      setStatus("Starting Android...");

      const response = await fetch("/api/sessions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ game })
      });

      if (!response.ok) {
        throw new Error("Could not create session");
      }

      const session = await response.json();
      sessionId = session.id;

      messageEl.textContent = "Connecting to Android...";
      connectWebRTC();

    } catch (error) {
      console.error(error);
      setStatus("Connection failed");
      messageEl.textContent = error.message;
    }
  }

  function connectWebRTC() {

    const gateway = ANDROID_GATEWAY
      .replace(/^https:/, "wss:")
      .replace(/^http:/, "ws:");

    const wsUrl =
      gateway.replace(/\/$/, "") +
      "/api/v1/emulator/ws-jsep";

    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      setStatus("Connecting...");
    };

    socket.onmessage = async event => {

      const data = JSON.parse(event.data);

      if (data.start) {

        peer = new RTCPeerConnection({
          iceServers: data.start.iceServers || [
            {
              urls: "stun:stun.l.google.com:19302"
            }
          ]
        });

        peer.ontrack = event => {

          if (event.streams && event.streams[0]) {
            videoEl.srcObject = event.streams[0];
            videoEl.style.display = "block";
            messageEl.classList.add("hidden");
            setStatus("Android connected");
          }
        };

        peer.onicecandidate = event => {

          if (event.candidate && socket.readyState === WebSocket.OPEN) {

            socket.send(JSON.stringify({
              candidate: {
                candidate: event.candidate.candidate,
                sdpMid: event.candidate.sdpMid,
                sdpMLineIndex: event.candidate.sdpMLineIndex
              }
            }));

          }
        };
      }

      if (data.sdp && peer) {

        await peer.setRemoteDescription(
          new RTCSessionDescription(data.sdp)
        );

        if (data.sdp.type === "offer") {

          const answer = await peer.createAnswer();

          await peer.setLocalDescription(answer);

          socket.send(JSON.stringify({
            sdp: {
              type: answer.type,
              sdp: answer.sdp
            }
          }));
        }
      }

      if (data.candidate && peer) {

        try {
          await peer.addIceCandidate(
            new RTCIceCandidate(data.candidate)
          );
        } catch (e) {
          console.log("ICE error", e);
        }
      }
    };

    socket.onerror = () => {
      setStatus("Android connection error");
      messageEl.textContent =
        "Could not connect to the Android Gateway.";
    };

    socket.onclose = () => {
      if (statusEl.textContent === "Android connected") {
        setStatus("Disconnected");
      }
    };
  }

  async function stopGame() {

    if (socket) {
      try {
        socket.send(JSON.stringify({ bye: true }));
      } catch {}
      socket.close();
      socket = null;
    }

    if (peer) {
      peer.close();
      peer = null;
    }

    if (sessionId) {
      try {
        await fetch("/api/sessions/" + sessionId, {
          method: "DELETE"
        });
      } catch {}

      sessionId = null;
    }

    videoEl.srcObject = null;
    videoEl.style.display = "none";

    messageEl.classList.remove("hidden");
    messageEl.textContent =
      "Choose a game to start the Android phone.";

    setStatus("Ready");
  }
</script>

</body>
</html>
